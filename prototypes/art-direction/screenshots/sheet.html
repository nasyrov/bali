<!-- PROTOTYPE helper: open at /prototypes/art-direction/screenshots/sheet.html to save contact-sheet.png -->
<body style="margin:0;background:#000"><canvas id=c width=1920 height=1080></canvas><script>
const names=['A-day','A-dusk','A-night','B-day','B-dusk','B-night','C-day','C-dusk','C-night'];
const ctx=c.getContext('2d');ctx.font='bold 28px system-ui';
(async()=>{for(let i=0;i<9;i++){const im=new Image();im.src=names[i]+".png?"+Date.now();await new Promise((res,rej)=>{im.onload=res;im.onerror=rej;});const x=(i%3)*640,y=Math.floor(i/3)*360;ctx.drawImage(im,x,y,640,360);ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(x,y,190,40);ctx.fillStyle='#fff';ctx.fillText(names[i],x+10,y+29);}
const r=await fetch('/shot?name=contact-sheet&dir=prototypes/art-direction/screenshots',{method:'POST',body:c.toDataURL('image/png')});document.title='saved '+await r.text();})();
</script></body>
